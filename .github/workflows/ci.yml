name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SKIP_ENV_VALIDATION: "true"
      # Placeholders so Prisma can generate without a real DB.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
      DIRECT_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
      NEXT_PUBLIC_SUPABASE_URL: "http://localhost"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder"
      SUPABASE_SERVICE_ROLE_KEY: "ci-placeholder"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Prisma generate + validate
        run: |
          npx prisma generate
          npx prisma validate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test --silent --if-present

      - name: Build
        run: npm run build
